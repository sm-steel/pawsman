[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sm-steel/pawsman"
publish = false

[workspace.dependencies]
# Internal crates (CODE-ARCHITECTURE §1); external dependencies are added by the tasks that need them.
pawsman-error = { path = "crates/pawsman-error" }
pawsman-core = { path = "crates/pawsman-core" }
pawsman-model = { path = "crates/pawsman-model" }
pawsman-net = { path = "crates/pawsman-net" }
pawsman-test-support = { path = "crates/pawsman-test-support" }
pawsman-tui = { path = "crates/pawsman-tui" }

bytes = "=1.12.1"
clap = { version = "=4.6.7", features = ["derive"] }
crossterm = "=0.29.0"
fastrand = "=2.5.0"
fontdue = "=0.9.5"
http = "=1.5.0"
http-body-util = { version = "=0.1.5", features = ["channel"] }
hyper = { version = "=1.12.0", features = ["client", "server", "http1"] }
hyper-util = { version = "=0.1.21", features = ["tokio"] }
image = { version = "=0.25.10", default-features = false, features = ["png"] }
insta = "=1.49.0"
proptest = "=1.12.0"
pty-process = "=0.5.4"
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "=0.7.1"
rstest = { version = "=0.28.0", default-features = false }
rustix = { version = "=1.1.5", features = ["event", "fs", "termios", "process", "stdio"] }
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
signal-hook = { version = "=0.4.5", default-features = false }
tachyonfx = { version = "=0.25.2", default-features = false, features = ["std"] }
tempfile = "=3.27.0"
toml = { version = "=1.1.8", default-features = false, features = ["std", "parse", "serde", "display", "preserve_order"] }
time = { version = "=0.3.55", default-features = false, features = ["std", "formatting"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util", "fs"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "=0.7.20"
tracing = "=0.1.44"
tracing-appender = "=0.2.5"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "std", "ansi"] }
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.2"
uuid = { version = "=1.29.0", default-features = false, features = ["std"] }
vt100 = "=0.18.1"

[workspace.lints.rust]
# Every crate root adds `#![forbid(unsafe_code)]`.
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
indexing_slicing = "warn"
print_stdout = "warn"
print_stderr = "warn"
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Code smells (nursery lint; limit in clippy.toml, default 25).
cognitive_complexity = "warn"
# Hygiene, as in uv/ruff and others (restriction/nursery lints, chosen one by one).
redundant_clone = "warn"
use_self = "warn"
exit = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
rest_pat_in_fully_bound_structs = "warn"
get_unwrap = "warn"
empty_drop = "warn"
empty_structs_with_brackets = "warn"
or_fun_call = "warn"
needless_pass_by_ref_mut = "warn"
needless_collect = "warn"
str_to_string = "warn"
# Deterministic output: no iteration over hash maps and sets.
iter_over_hash_type = "warn"
# Rust rule 5: a `From` that can fail is a `TryFrom`.
fallible_impl_from = "warn"
# Module layout: `foo.rs` + `foo/`, no `mod.rs` (CODE-ARCHITECTURE, modules and files).
mod_module_files = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
